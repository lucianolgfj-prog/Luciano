services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jda
      POSTGRES_USER: jda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no shell ou .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jda_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jda -d jda"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  jda_pg:
